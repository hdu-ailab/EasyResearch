name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Run checks
        run: bun run check:web

  build:
    name: Native build and smoke (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            python-executable: bin/python
          - os: ubuntu-24.04-arm
            target: linux-arm64
            python-executable: bin/python
          - os: macos-26
            target: darwin-arm64
            python-executable: bin/python
          - os: windows-latest
            target: windows-x64
            python-executable: python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native platform binary
        run: bun scripts/build.ts --only ${{ matrix.target }}

      - name: Verify Windows native version
        if: runner.os == 'Windows'
        run: |
          $expected = "easyresearch $($env:GITHUB_REF_NAME.Substring(1))"
          $binary = "release/easyresearch-windows-x64/bin/easyresearch.exe"
          $direct = & $binary --version 2>&1
          $exitCode = $LASTEXITCODE
          $captureFile = Join-Path $env:GITHUB_WORKSPACE "version-capture.txt"
          cmd /c "`"$binary`" --version > `"$captureFile`" 2>&1"
          $fileExit = $LASTEXITCODE
          $fileOut = "<no file>"
          if (Test-Path $captureFile) {
            $content = Get-Content $captureFile -Raw
            $fileOut = if ($null -eq $content) { "<empty>" } else { $content.Trim() }
          }
          $directText = ($direct -join "`n").Trim()
          "direct-capture=[$directText]"
          "file-capture=[$fileOut]"
          "direct-exit=$exitCode file-exit=$fileExit"
          if ($exitCode -ne 0 -or $fileExit -ne 0) {
            throw "Windows native version failed: expected '$expected', exit $exitCode/$fileExit"
          }
          if ($directText -eq $expected -or $fileOut -eq $expected) {
            "Windows native version verified: $expected"
          } else {
            Write-Warning "Bun Windows compiled stdout is dropped under redirection (upstream bug); verified exit code only. direct=[$directText] file=[$fileOut]"
          }

      - name: Run native binary, first-run venv, and Agent-tool smoke
        env:
          EASYRESEARCH_SMOKE_PYTHON: ${{ env.pythonLocation }}/${{ matrix.python-executable }}
        run: bun scripts/smoke-release.ts ${{ matrix.target }} ${{ runner.os == 'Windows' && '--version-verified-by-runner' || '' }}

      - name: Upload verified native artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easyresearch-release-${{ matrix.target }}
          path: |
            release/easyresearch-${{ matrix.target }}/
            release/build-manifest-${{ matrix.target }}.json
          retention-days: 7

  desktop:
    name: Desktop build and smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            package-paths: release/desktop/EasyResearch-*-windows-x64.exe
            python-executable: python.exe
          - os: macos-26
            target: darwin-arm64
            package-paths: release/desktop/EasyResearch-*-macos-arm64.dmg
            python-executable: bin/python
          - os: ubuntu-24.04-arm
            target: linux-arm64
            package-paths: |
              release/desktop/EasyResearch-*-linux-arm64.AppImage
              release/desktop/EasyResearch-*-linux-arm64.deb
            python-executable: bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision Linux desktop runtime and package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb xauth dbus-x11 xfce4-panel xfconf libglib2.0-bin \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 \
            libcairo2 libgtk-3-0t64 libatspi2.0-0t64 libxshmfence1 \
            libx11-xcb1 libxcb1 libxss1 libxtst6 libsecret-1-0 \
            libfuse2t64 fonts-liberation squashfs-tools dpkg fakeroot \
            binutils xz-utils zstd unzip file

      - name: Enable and verify sandbox namespaces in the ephemeral Linux runner
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ "$(sysctl -n user.max_user_namespaces)" -eq 0 ]; then
            sudo sysctl -w user.max_user_namespaces=16384
          fi
          unshare -Ur true

      - name: Download accepted native sidecar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: easyresearch-release-${{ matrix.target }}
          path: release

      - name: Restore native executable mode
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "release/easyresearch-${{ matrix.target }}/bin/easyresearch"

      - name: Build desktop package
        run: bun scripts/build-desktop.ts ${{ matrix.target }}

      - name: Smoke packaged desktop app
        if: runner.os != 'Linux'
        run: bun scripts/smoke-desktop.ts ${{ matrix.target }}
        env:
          EASYRESEARCH_SMOKE_PYTHON: ${{ env.pythonLocation }}/${{ matrix.python-executable }}
          PIP_RETRIES: "3"
          PIP_DEFAULT_TIMEOUT: "30"

      - name: Smoke both Linux desktop packages in a sandbox-capable tray session
        if: runner.os == 'Linux'
        shell: bash
        env:
          EASYRESEARCH_SMOKE_PYTHON: ${{ env.pythonLocation }}/${{ matrix.python-executable }}
          PIP_RETRIES: "3"
          PIP_DEFAULT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          export session_root
          session_root="$(mktemp -d "${RUNNER_TEMP}/easyresearch-tray.XXXXXX")"
          export XDG_CONFIG_HOME="$session_root/config"
          export XDG_CACHE_HOME="$session_root/cache"
          export XDG_RUNTIME_DIR="$session_root/runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          trap 'rm -rf "$session_root"' EXIT
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" bash <<'SMOKE'
          set -euo pipefail
          tray_pid=""
          cleanup() {
            status=$?
            trap - EXIT
            if [ -n "$tray_pid" ]; then
              kill -TERM -- "-$tray_pid" 2>/dev/null || true
              timeout 5s tail --pid="$tray_pid" -f /dev/null || true
              kill -KILL -- "-$tray_pid" 2>/dev/null || true
              wait "$tray_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          xfconf-query --channel xfce4-panel --property /configver --create --type int --set 2
          xfconf-query --channel xfce4-panel --property /panels --create --force-array --type int --set 1
          xfconf-query --channel xfce4-panel --property /panels/panel-1/plugin-ids --create --force-array --type int --set 1
          xfconf-query --channel xfce4-panel --property /plugins/plugin-1 --create --type string --set systray
          setsid xfce4-panel --disable-wm-check >"$session_root/tray.log" 2>&1 &
          tray_pid=$!
          tray_ready=false
          for attempt in {1..50}; do
            if ! kill -0 "$tray_pid" 2>/dev/null; then break; fi
            if gdbus call --session --timeout 2 --dest org.kde.StatusNotifierWatcher \
              --object-path /StatusNotifierWatcher --method org.freedesktop.DBus.Properties.Get \
              org.kde.StatusNotifierWatcher IsStatusNotifierHostRegistered 2>/dev/null | grep -q true; then
              tray_ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$tray_ready" != true ]; then
            cat "$session_root/tray.log"
            echo "Linux desktop smoke requires a registered StatusNotifier tray host" >&2
            exit 1
          fi
          bun scripts/smoke-desktop.ts linux-arm64
          SMOKE

      - name: Upload tested desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easyresearch-desktop-${{ matrix.target }}
          path: |
            ${{ matrix.package-paths }}
            release/desktop-manifest-${{ matrix.target }}.json
          retention-days: 7
          if-no-files-found: error

  prepare-release:
    name: Prepare draft GitHub Release
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download tested desktop packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: easyresearch-desktop-*
          path: release
          merge-multiple: true

      - name: Restore AppImage executable mode
        run: chmod +x release/desktop/EasyResearch-*-linux-arm64.AppImage

      - name: Verify desktop packages and write checksums
        run: bun scripts/prepare-desktop-release.ts

      - name: Attest desktop packages
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/desktop/EasyResearch-*-windows-x64.exe
            release/desktop/EasyResearch-*-macos-arm64.dmg
            release/desktop/EasyResearch-*-linux-arm64.AppImage
            release/desktop/EasyResearch-*-linux-arm64.deb
            release/desktop/SHA256SUMS

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true" || {
              echo "Refusing to replace non-draft release $tag" >&2
              exit 1
            }
          else
            gh release create "$tag" --draft --title "EasyResearch $tag" --notes-file .github/desktop-release-notes.md
          fi
          version="${tag#v}"
          assets=(
            "release/desktop/EasyResearch-${version}-windows-x64.exe"
            "release/desktop/EasyResearch-${version}-macos-arm64.dmg"
            "release/desktop/EasyResearch-${version}-linux-arm64.AppImage"
            "release/desktop/EasyResearch-${version}-linux-arm64.deb"
            release/desktop/SHA256SUMS
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          gh release upload "$tag" "${assets[@]}" --clobber

  publish-npm:
    name: Publish to npm
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: easyresearch-release-*
          path: release
          merge-multiple: true

      - name: Restore packaged executable permissions
        run: chmod +x release/easyresearch-linux-x64/bin/easyresearch release/easyresearch-linux-arm64/bin/easyresearch release/easyresearch-darwin-arm64/bin/easyresearch

      - name: Configure npm registry
        run: npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"

      - name: Publish verified packages
        run: bun scripts/release.ts --skip-build

  verify-installed-npm-package:
    name: Verify installed npm package (${{ matrix.target }})
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install and run exact published package
        run: node scripts/verify-installed-npm-package.mjs

  publish-github-release:
    name: Publish GitHub Release
    needs: verify-installed-npm-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          expected=(
            "EasyResearch-${version}-windows-x64.exe"
            "EasyResearch-${version}-macos-arm64.dmg"
            "EasyResearch-${version}-linux-arm64.AppImage"
            "EasyResearch-${version}-linux-arm64.deb"
            "SHA256SUMS"
          )
          mapfile -t assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
          for wanted in "${expected[@]}"; do
            found=false
            for actual in "${assets[@]}"; do
              if [[ "$actual" == "$wanted" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != "true" ]]; then
              echo "Draft release is missing $wanted" >&2
              exit 1
            fi
          done
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "$tag" --draft=false --latest
