name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Instrumented real entry probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe P - instrumented entry
        shell: pwsh
        run: |
          $entry = Get-Content src/cli/index.ts -Raw
          $entry = $entry.Replace("async function runRuntimeEntry(args: string[]): Promise<void> {", "async function runRuntimeEntry(args: string[]): Promise<void> {`n  console.log('P-runtime-entry');")
          $entry = $entry.Replace("if (import.meta.main) {", "if (import.meta.main) {`n  console.log('P-main-true');")
          $entry = $entry.Replace("await runRuntimeEntry(args);", "console.log('P-before-run');`n  await runRuntimeEntry(args);`n  console.log('P-after-run');")
          $entry | Out-File -Encoding utf8 probe-p.ts
          bun build probe-p.ts --compile --minify --outfile probe-p.exe
          New-Item -ItemType Directory -Force smokehome5 | Out-Null
          $env:HOME = "$pwd\smokehome5"
          $env:USERPROFILE = "$pwd\smokehome5"
          $env:LOCALAPPDATA = "$pwd\smokehome5\la"
          $env:EASYRESEARCH_CODING_AGENT_DIR = "$pwd\smokehome5\agent"
          $out = .\probe-p.exe --no-open --port 32128 2>&1
          "P-exit=$LASTEXITCODE"
          $out | ForEach-Object { "P-capture: $_" }
          "P-files=$((Get-ChildItem -Recurse smokehome5 -File | Measure-Object).Count)"
