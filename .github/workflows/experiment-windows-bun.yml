name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Entry-level compiled exe probes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe H - shebang, import.meta.main, top-level await
        shell: pwsh
        run: |
          @'
          #!/usr/bin/env bun
          if (import.meta.main) {
            await Bun.sleep(1);
            console.log("H-main-await");
          }
          '@ | Out-File -Encoding utf8 probe-h.ts
          bun build probe-h.ts --compile --minify --outfile probe-h.exe
          $out = .\probe-h.exe 2>&1
          "H-exit=$LASTEXITCODE capture=[$($out -join "`n")]"

      - name: Probe I - real entry with stub assets
        shell: pwsh
        run: |
          @'
          import { Bun } from "bun";
          const result = await Bun.build({
            entrypoints: ["src/cli/index.ts"],
            compile: { target: "bun-windows-x64", outfile: "probe-i.exe" },
            minify: true,
            alias: { "@easyresearch/embedded-assets": "./src/generated/embedded-assets.test-stub.ts" },
          });
          console.log("build:", result.success, result.logs);
          '@ | Out-File -Encoding utf8 probe-i-build.ts
          bun run probe-i-build.ts
          New-Item -ItemType Directory -Force smokehome3 | Out-Null
          $env:HOME = "$pwd\smokehome3"
          $env:USERPROFILE = "$pwd\smokehome3"
          $env:LOCALAPPDATA = "$pwd\smokehome3\la"
          $p = Start-Process -FilePath ".\probe-i.exe" -ArgumentList @('--no-open','--port','32125') -Wait -PassThru
          "I-exit=$($p.ExitCode)"
          "I-files=$((Get-ChildItem -Recurse smokehome3 -File | Measure-Object).Count)"
          Get-ChildItem -Recurse smokehome3 -File | Select-Object -First 10 -ExpandProperty FullName
