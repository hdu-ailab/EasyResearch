name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Build API vs CLI probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe U - Bun.build API without alias
        shell: pwsh
        run: |
          @'
          const result = await Bun.build({
            entrypoints: ["src/cli/index.ts"],
            compile: { target: "bun-windows-x64", outfile: "probe-u.exe" },
            minify: true,
          });
          console.log("build-success:", result.success);
          '@ | Out-File -Encoding utf8 probe-u-build.ts
          bun run probe-u-build.ts
          New-Item -ItemType Directory -Force smokehome8 | Out-Null
          $env:HOME = "$pwd\smokehome8"
          $env:USERPROFILE = "$pwd\smokehome8"
          $env:LOCALAPPDATA = "$pwd\smokehome8\la"
          $env:EASYRESEARCH_CODING_AGENT_DIR = "$pwd\smokehome8\agent"
          $out = .\probe-u.exe --no-open --port 32131 2>&1
          "U-exit=$LASTEXITCODE"
          $out | Select-Object -First 5 | ForEach-Object { "U-capture: $_" }
          "U-files=$((Get-ChildItem -Recurse smokehome8 -File | Measure-Object).Count)"

      - name: Probe V - Bun.build API with full asset module
        shell: pwsh
        run: |
          bun scripts/build.ts --only windows-x64
          New-Item -ItemType Directory -Force smokehome9 | Out-Null
          $env:HOME = "$pwd\smokehome9"
          $env:USERPROFILE = "$pwd\smokehome9"
          $env:LOCALAPPDATA = "$pwd\smokehome9\la"
          $env:EASYRESEARCH_CODING_AGENT_DIR = "$pwd\smokehome9\agent"
          $out = .\release\easyresearch-windows-x64\bin\easyresearch.exe --no-open --port 32132 2>&1
          "V-exit=$LASTEXITCODE"
          $out | Select-Object -First 5 | ForEach-Object { "V-capture: $_" }
          "V-files=$((Get-ChildItem -Recurse smokehome9 -File | Measure-Object).Count)"
