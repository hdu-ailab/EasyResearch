name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Module graph load probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe L - dynamic import of real entry
        shell: pwsh
        run: |
          @'
          console.log("L-before-import");
          await import("./src/cli/index.ts");
          console.log("L-after-import");
          '@ | Out-File -Encoding utf8 probe-l.ts
          bun build probe-l.ts --compile --minify --outfile probe-l.exe
          $out = .\probe-l.exe 2>&1
          "L-exit=$LASTEXITCODE capture=[$($out -join "`n")]"

      - name: Probe M - static import of real entry modules
        shell: pwsh
        run: |
          @'
          console.log("M-start");
          await import("./src/cli/server-process");
          console.log("M-server-process-ok");
          await import("./src/cli/commands/serve");
          console.log("M-serve-ok");
          await import("./src/setup-venv");
          console.log("M-venv-ok");
          await import("./src/runtime/pi-import");
          console.log("M-pi-import-ok");
          '@ | Out-File -Encoding utf8 probe-m.ts
          bun build probe-m.ts --compile --minify --outfile probe-m.exe
          $out = .\probe-m.exe 2>&1
          "M-exit=$LASTEXITCODE capture=[$($out -join "`n")]"
