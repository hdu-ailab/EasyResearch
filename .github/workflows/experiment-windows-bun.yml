name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Entry top-level await probes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe N - pi-ai dynamic imports
        shell: pwsh
        run: |
          @'
          console.log("N-start");
          const { registerBunOAuthFlows } = await import("@earendil-works/pi-ai/bun-oauth");
          console.log("N-oauth-ok");
          registerBunOAuthFlows();
          console.log("N-registered");
          const { bedrockProviderModule } = await import("@earendil-works/pi-ai/bedrock-provider");
          console.log("N-bedrock-ok");
          const { setBedrockProviderModule } = await import("@earendil-works/pi-ai/compat");
          setBedrockProviderModule(bedrockProviderModule);
          console.log("N-done");
          '@ | Out-File -Encoding utf8 probe-n.ts
          bun build probe-n.ts --compile --minify --outfile probe-n.exe
          $out = .\probe-n.exe 2>&1
          "N-exit=$LASTEXITCODE capture=[$($out -join "`n")]"

      - name: Probe O - exact entry top-level await copy
        shell: pwsh
        run: |
          @'
          const args = ["--no-open", "--port", "32127"];
          if (args[0] === "--version" || args[0] === "-v") {
            console.log("O-version");
          } else {
            console.log("O-runtime-start");
            const { registerBunOAuthFlows } = await import("@earendil-works/pi-ai/bun-oauth");
            registerBunOAuthFlows();
            const { bedrockProviderModule } = await import("@earendil-works/pi-ai/bedrock-provider");
            const { setBedrockProviderModule } = await import("@earendil-works/pi-ai/compat");
            setBedrockProviderModule(bedrockProviderModule);
            console.log("O-registered");
          }
          '@ | Out-File -Encoding utf8 probe-o.ts
          bun build probe-o.ts --compile --minify --outfile probe-o.exe
          $out = .\probe-o.exe 2>&1
          "O-exit=$LASTEXITCODE capture=[$($out -join "`n")]"
