name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Minimal compiled exe probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Minimal console.log exe
        shell: pwsh
        run: |
          "console.log('hello-from-bun')" | Out-File -Encoding utf8 hello.ts
          bun build hello.ts --compile --outfile hello.exe
          Write-Host "--- direct ---"
          .\hello.exe
          Write-Host "direct-exit=$LASTEXITCODE"
          Write-Host "--- capture ---"
          $out = .\hello.exe 2>&1
          Write-Host "capture=[$($out -join "`n")] exit=$LASTEXITCODE"
          Write-Host "--- cmd redirect ---"
          cmd /c ".\hello.exe > out.txt 2>&1"
          Write-Host "cmd-exit=$LASTEXITCODE"
          if (Test-Path out.txt) { Write-Host "out=[$(Get-Content out.txt -Raw)]" }
          Write-Host "--- process ---"
          $p = Start-Process -FilePath ".\hello.exe" -Wait -PassThru -WindowStyle Hidden
          Write-Host "process-exit=$($p.ExitCode)"
