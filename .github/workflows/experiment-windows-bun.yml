name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Full entry compiled exe probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Build real windows exe
        run: bun install --frozen-lockfile && bun scripts/build.ts --only windows-x64

      - name: Probe E - minify with-file
        shell: pwsh
        run: |
          "hello content" | Out-File -Encoding utf8 hello3.txt
          "import x from './hello3.txt' with { type: 'file' }; console.log('E-minify:', x)" | Out-File -Encoding utf8 probe-e.ts
          bun build probe-e.ts --compile --minify --outfile probe-e.exe
          $out = .\probe-e.exe 2>&1
          "E-exit=$LASTEXITCODE capture=[$($out -join "`n")]"

      - name: Probe F - real exe, normal PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smokehome | Out-Null
          $env:HOME = "$pwd\smokehome"
          $env:USERPROFILE = "$pwd\smokehome"
          $env:LOCALAPPDATA = "$pwd\smokehome\la"
          $p = Start-Process -FilePath ".\release\easyresearch-windows-x64\bin\easyresearch.exe" -ArgumentList @('--no-open','--port','32123') -Wait -PassThru
          "F-exit=$($p.ExitCode)"
          "F-files=$((Get-ChildItem -Recurse smokehome -File | Measure-Object).Count)"

      - name: Probe G - real exe, empty PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smokehome2 | Out-Null
          $env:HOME = "$pwd\smokehome2"
          $env:USERPROFILE = "$pwd\smokehome2"
          $env:LOCALAPPDATA = "$pwd\smokehome2\la"
          $env:PATH = ""
          $p = Start-Process -FilePath ".\release\easyresearch-windows-x64\bin\easyresearch.exe" -ArgumentList @('--no-open','--port','32124') -Wait -PassThru
          "G-exit=$($p.ExitCode)"
          "G-files=$((Get-ChildItem -Recurse smokehome2 -File | Measure-Object).Count)"
