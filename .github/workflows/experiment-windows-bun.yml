name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: Plain entry compile probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe R - plain original entry via CLI
        shell: pwsh
        run: |
          bun build src/cli/index.ts --compile --minify --outfile probe-r.exe
          New-Item -ItemType Directory -Force smokehome6 | Out-Null
          $env:HOME = "$pwd\smokehome6"
          $env:USERPROFILE = "$pwd\smokehome6"
          $env:LOCALAPPDATA = "$pwd\smokehome6\la"
          $env:EASYRESEARCH_CODING_AGENT_DIR = "$pwd\smokehome6\agent"
          $out = .\probe-r.exe --no-open --port 32129 2>&1
          "R-exit=$LASTEXITCODE"
          $out | Select-Object -First 10 | ForEach-Object { "R-capture: $_" }
          "R-files=$((Get-ChildItem -Recurse smokehome6 -File | Measure-Object).Count)"

      - name: Probe S - plain original entry without minify
        shell: pwsh
        run: |
          bun build src/cli/index.ts --compile --outfile probe-s.exe
          New-Item -ItemType Directory -Force smokehome7 | Out-Null
          $env:HOME = "$pwd\smokehome7"
          $env:USERPROFILE = "$pwd\smokehome7"
          $env:LOCALAPPDATA = "$pwd\smokehome7\la"
          $env:EASYRESEARCH_CODING_AGENT_DIR = "$pwd\smokehome7\agent"
          $out = .\probe-s.exe --no-open --port 32130 2>&1
          "S-exit=$LASTEXITCODE"
          $out | Select-Object -First 10 | ForEach-Object { "S-capture: $_" }
          "S-files=$((Get-ChildItem -Recurse smokehome7 -File | Measure-Object).Count)"
