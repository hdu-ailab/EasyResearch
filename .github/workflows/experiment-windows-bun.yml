name: Windows Bun exe experiment

on:
  push:
    branches:
      - "experiment-windows-bun"

jobs:
  repro:
    name: import.meta.main probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Probe K - import.meta.main truthiness in compiled exe
        shell: pwsh
        run: |
          @'
          console.log("K-main=" + (import.meta.main ? "true" : "false"));
          if (import.meta.main) {
            console.log("K-body-ran");
          }
          '@ | Out-File -Encoding utf8 probe-k.ts
          bun build probe-k.ts --compile --outfile probe-k.exe
          $out = .\probe-k.exe 2>&1
          "K-exit=$LASTEXITCODE capture=[$($out -join "`n")]"
          $p = Start-Process -FilePath ".\probe-k.exe" -Wait -PassThru
          "K-process-exit=$($p.ExitCode)"
