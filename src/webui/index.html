<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231D5C8F'/%3E%3Crect x='2' y='2' width='2' height='12' fill='white'/%3E%3C/svg%3E"
    />
    <title>LazyResearch</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("lazyresearch.webui.preferences");
          if (!raw) return;
          var p = JSON.parse(raw);
          var chat = typeof p.chatFontSize === "number" && Number.isInteger(p.chatFontSize)
            ? Math.min(20, Math.max(10, p.chatFontSize)) : 13;
          var files = typeof p.filesFontSize === "number" && Number.isInteger(p.filesFontSize)
            ? Math.min(20, Math.max(10, p.filesFontSize)) : 12;
          document.documentElement.style.setProperty("--v2-chat-font-size", chat + "px");
          document.documentElement.style.setProperty("--v2-files-font-size", files + "px");
          if (p.language === "en" || p.language === "zh-CN") document.documentElement.lang = p.language;
        } catch (e) {
          /* malformed prefs: keep defaults */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
