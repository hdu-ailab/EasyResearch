<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>EasyResearch</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem("easyresearch.webui.preferences");
          if (!raw) return;
          const p = JSON.parse(raw);
          const chat = typeof p.chatFontSize === "number" && Number.isInteger(p.chatFontSize)
            ? Math.min(20, Math.max(10, p.chatFontSize)) : 13;
          const files = typeof p.filesFontSize === "number" && Number.isInteger(p.filesFontSize)
            ? Math.min(20, Math.max(10, p.filesFontSize)) : 12;
          document.documentElement.style.setProperty("--v2-chat-font-size", `${chat}px`);
          document.documentElement.style.setProperty("--v2-files-font-size", `${files}px`);
          if (p.language === "en" || p.language === "zh-CN") document.documentElement.lang = p.language;
        } catch {
          /* malformed prefs: keep defaults */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
